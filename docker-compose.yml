version: '3.8'

services:
  app:
    build: .
    container_name: jarvis-app
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      # Use postgres as host because they are on the same docker network
      DB_URI: "postgresql://jarvis_user:jarvis_password_change_me@postgres:5432/jarvis_db"
    env_file:
      - .env
    volumes:
      - .:/app

  postgres:
    image: postgres:16-alpine
    container_name: jarvis-postgres
    restart: always
    environment:
      POSTGRES_USER: jarvis_user
      POSTGRES_PASSWORD: jarvis_password_change_me
      POSTGRES_DB: jarvis_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
