version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jarvis-postgres
    restart: always
    environment:
      POSTGRES_USER: jarvis_user
      POSTGRES_PASSWORD: jarvis_password_change_me
      POSTGRES_DB: jarvis_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
